{{/* dashboard.html is the supervisor's listing page: every tracked listener
     with its state and quick actions, plus a "new listener" button. */}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>veepin supervisor</title>
  <style>
    body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 24px; }
    h1 { font-size: 18px; }
    table { width: 100%; border-collapse: collapse; margin: 12px 0; }
    th, td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; }
    .st-running { color: #0a0; font-weight: 600; }
    .st-error, .st-unknown { color: #c00; }
    .st-stopped, .st-disabled { color: #888; }
    .st-building { color: #08c; }
    button { margin-right: 6px; cursor: pointer; }
    .new-btn { font-weight: 600; }
    a { color: #06c; }
    pre { background: #f6f6f6; padding: 6px; overflow-x: auto; }
    .muted { color: #888; }
  </style>
</head>
<body>
  <h1>veepin supervisor</h1>
  <p>Listener directory &mdash; <a href="/listeners/new" class="new-btn">new listener</a></p>
  <table id="listeners">
    <thead><tr>
      <th>name</th><th>protocol</th><th>state</th>
      <th>tun</th><th>gateway</th><th>network</th><th>error</th><th>actions</th>
    </tr></thead>
    <tbody><tr><td colspan="8" class="muted">loading…</td></tr></tbody>
  </table>
  <p class="muted">Token: <code title="the bearer sent on each /api fetch">{{.Token}}</code></p>
<script>
window.VEEPIN_TOKEN = "{{.Token}}";
const api = (path, opts) => {
  opts = Object.assign({}, opts || {});
  opts.headers = Object.assign({"Authorization": "Bearer " + window.VEEPIN_TOKEN}, opts.headers || {});
  return fetch(path, opts).then(r => r.json().then(body => ({status: r.status, body})));
};

function renderRow(l) {
  const cls = "st-" + (l.state||"unknown");
  const line = '<tr>' +
    '<td><a href="/listeners/' + encodeURIComponent(l.name) + '">' + l.name + '</a></td>' +
    '<td>' + l.protocol + '</td>' +
    '<td class="' + cls + '">' + (l.state||"") + '</td>' +
    '<td>' + (l.tun||"") + '</td>' +
    '<td>' + (l.gateway||"") + '</td>' +
    '<td>' + (l.network||"") + '</td>' +
    '<td>' + (l.error||"") + '</td>' +
    '<td><button data-restart="' + l.name + '">restart</button>' +
    '<button data-delete="' + l.name + '">delete</button></td>' +
    '</tr>';
  return line;
}

function refresh() {
  api("/api/listeners").then(({status, body}) => {
    const tbody = document.querySelector("#listeners tbody");
    if (!body.listeners || body.listeners.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="muted">no listeners</td></tr>';
      return;
    }
    tbody.innerHTML = body.listeners.map(renderRow).join("");
  });
}

document.addEventListener("click", e => {
  const name = e.target.dataset.restart;
  if (name !== undefined) {
    api("/api/listeners/" + encodeURIComponent(name) + "/restart", {method: "POST"})
      .then(() => refresh());
  }
  const delName = e.target.dataset.delete;
  if (delName !== undefined) {
    if (!confirm("delete listener " + delName + "?")) return;
    api("/api/listeners/" + encodeURIComponent(delName), {method: "DELETE"})
      .then(() => refresh());
  }
});

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
