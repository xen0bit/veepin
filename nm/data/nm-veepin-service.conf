<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  D-Bus system-bus policy for the veepin NetworkManager VPN plugin services.
  Only root may own the service names (NetworkManager spawns them as root), and
  only root -- NetworkManager -- may call them. The services run as root and
  dial whatever a Connect names, so a call from any other user is a request to
  run a tunnel, or tear one down, with root's authority. The stock openvpn and
  pptp policies deny the default context in the same way. The default context
  has no allow here at all: system.conf already denies method calls, and an
  allow on send_interface with no destination would match every service on the
  bus that implements the interface. Install to /usr/share/dbus-1/system.d/.

  own_prefix rather than own, because veepin registers one service per protocol
  — org.freedesktop.NetworkManager.veepin.ikev2 and so on, one per entry in the
  OS's "Add VPN" list. A prefix keeps adding a protocol a change to the Makefile
  list alone, and is what the stock openvpn and pptp policies do for the same
  reason. send_destination has no prefix form, so root's send rule names the
  interface as well, which is what reaches the per-protocol names.
-->
<busconfig>
  <policy user="root">
    <allow own_prefix="org.freedesktop.NetworkManager.veepin"/>
    <allow send_destination="org.freedesktop.NetworkManager.veepin"/>
    <allow send_interface="org.freedesktop.NetworkManager.VPN.Plugin"/>
  </policy>
  <policy context="default">
    <deny own_prefix="org.freedesktop.NetworkManager.veepin"/>
  </policy>
</busconfig>
