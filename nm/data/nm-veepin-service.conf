<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  D-Bus system-bus policy for the veepin NetworkManager VPN plugin services.
  Only root may own the service names (NetworkManager spawns them as root); any
  client may send to them, matching how the stock NM VPN plugins are policed.
  Install to /usr/share/dbus-1/system.d/.

  own_prefix rather than own, because veepin registers one service per protocol
  — org.freedesktop.NetworkManager.veepin.ikev2 and so on, one per entry in the
  OS's "Add VPN" list. A prefix keeps adding a protocol a change to the Makefile
  list alone, and is what the stock openvpn and pptp policies do for the same
  reason. send_destination has no prefix form, so it stays broad the way the
  stock policies leave it: sending to a name that nobody owns does nothing.
-->
<busconfig>
  <policy user="root">
    <allow own_prefix="org.freedesktop.NetworkManager.veepin"/>
    <allow send_destination="org.freedesktop.NetworkManager.veepin"/>
    <allow send_interface="org.freedesktop.NetworkManager.VPN.Plugin"/>
  </policy>
  <policy context="default">
    <deny own_prefix="org.freedesktop.NetworkManager.veepin"/>
    <allow send_destination="org.freedesktop.NetworkManager.veepin"/>
    <allow send_interface="org.freedesktop.NetworkManager.VPN.Plugin"/>
  </policy>
</busconfig>
