# Reference AnyConnect client (openconnect) -> veepin AnyConnect server, with
# downstream flow shaping on (`veepin serve anyconnect -shape`).
#
# The server pads the CSTP data payload past the inner IP packet. CSTP has no
# padding provision of its own — the length field simply says how many octets
# follow — so the filler is only inert because the receiver delimits the real
# packet by the IP header's Total Length, as every IP stack must (Ethernet pads
# short frames the same way). This cell is what turns that argument into a
# tested fact: a ping reply proves both that openconnect accepted the padded
# packets and that they were trimmed correctly, since a mis-trimmed packet
# could not produce a valid reply.
name: veepin-interop-anyconnect-server-shaped

services:
  veepin-anyconnect-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      USER: "ocuser"
      PASS: "ocpass"
      SHAPE: "16384"
    volumes:
      - ./anyconnect/pki:/pki:ro
      - ./veepin/anyconnect-server-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  openconnect:
    build:
      context: openconnect
    image: interop-openconnect
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    depends_on: [veepin-anyconnect-server]
    environment:
      SERVER: "veepin-anyconnect-server"
      USER: "ocuser"
      PASS: "ocpass"
    volumes:
      - ./anyconnect/pki:/pki:ro
      - ./openconnect/entrypoint.sh:/entrypoint.sh:ro
