# veepin WireGuard client -> reference wireguard-go responder, carrying IPv6
# inside the tunnel. Data-path check: the client pings fd00:10:10::1.
#
# The mirror of compose.wireguard-v6.yml, and it tests a different half. That
# cell covers the server's inbound cryptokey routing and its own v6 address on
# the host; this one covers the *client* Result: veepin has to report
# AssignedIP6/Prefix6 so dataplane's client routing puts the address on tun0.
# Until the client stopped discarding every address after the first, this
# invocation came up IPv4-only with nothing logged.
#
# The underlay stays IPv4 throughout; only the inner family changes.
name: veepin-interop-wg-client-v6

x-wg-keys: &wg-keys
  SERVER_PRIVATE: "+IRmjL6NRpthikeXn+jGUJNLe1ZJKQaqeWubiG9+GHs="
  SERVER_PUBLIC: "srb9CBWUN+UL2CYhqHoL+rGKFPNu6nUJiNStgH0EBWM="
  CLIENT_PRIVATE: "CHk+5XZnPhJ+UXfIx83SaePpgYrK+0/FqiPvNvTp3Hg="
  CLIENT_PUBLIC: "gjMMAROzi5lHFapIKeaAdJ2RhGe0lW24XysGzBd1OSM="
  PSK: "cjldFdAmi69yIFhc0Sms/5Yz6boVXkMZbMJl+RzzMZM="
  SERVER_TUN_IP: "10.10.10.1"
  CLIENT_TUN_IP: "10.10.10.2"
  SERVER_TUN_IP6: "fd00:10:10::1"
  CLIENT_TUN_IP6: "fd00:10:10::2"

services:
  wg-server:
    build:
      context: wireguard
    image: interop-wireguard
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      <<: *wg-keys
    volumes:
      - ./wireguard/server-v6-entrypoint.sh:/entrypoint.sh:ro
    command: ["/bin/sh", "/entrypoint.sh"]

  veepin-wg-client:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    depends_on: [wg-server]
    environment:
      <<: *wg-keys
      SERVER: "wg-server"
    volumes:
      - ./veepin/wg-client-v6-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
