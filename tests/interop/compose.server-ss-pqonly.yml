# veepin's pq-ikev2 SERVER, with a post-quantum strongSwan initiator.
#
# This is the positive half of the pq-ikev2 pair. It differs from
# compose.server-ss-pq.yml in one word -- PROTOCOL: pq-ikev2 -- and that word is
# the whole point: the same strongSwan configuration that succeeds here is
# REFUSED by compose.server-ss-pqrefuse.yml once its ke1_ proposal is removed.
# Running only this one would prove the server still works, not that it requires
# anything.
name: veepin-interop-b-pqonly

services:
  veepin-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      PSK: "interop-test-psk"
      SERVER_ID: "vpn.example.com"
      PROTOCOL: "pq-ikev2"
    volumes:
      - ./veepin/server-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  strongswan-client:
    build:
      context: strongswan-pq
    image: interop-strongswan-pq
    cap_add: [NET_ADMIN]
    depends_on: [veepin-server]
    sysctls:
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    volumes:
      - ./strongswan/swanctl-client-pq.conf:/etc/swanctl/swanctl.conf:ro
      - ./strongswan-pq/99-stdout-log.conf:/etc/strongswan.d/99-stdout-log.conf:ro
      - ./strongswan-pq/client-entrypoint.sh:/entrypoint.sh:ro
    command: ["/bin/sh", "/entrypoint.sh"]
