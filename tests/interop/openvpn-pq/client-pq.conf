# Reference OpenVPN client -> veepin's pq-openvpn server. The mirror of
# server-pq.conf, and it pins the same two things for the same reason: TLS 1.3
# only, and a key exchange list with no classical member, so this cell cannot
# pass on a fallback.
#
# remote-cert-tls server keeps OpenVPN's own EKU check in the path, so the cell
# also proves an ML-DSA leaf survives it.
client
dev tun
proto udp
remote veepin-pq-ovpn-server 1194
topology subnet
ca /pki/ca.crt
cert /pki/client.crt
key /pki/client.key
remote-cert-tls server
tls-version-min 1.3
tls-groups X25519MLKEM768:MLKEM768
data-ciphers AES-256-GCM
data-ciphers-fallback AES-256-GCM
keepalive 10 60
nobind
resolv-retry infinite
connect-retry 2
verb 4
