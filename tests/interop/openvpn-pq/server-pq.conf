# Reference OpenVPN server for the pq-openvpn cell: UDP, AES-256-GCM, an
# ML-DSA-65 PKI, and TLS 1.3 with the key exchange restricted to ML-KEM.
#
# tls-version-min 1.3 and tls-groups are what make the cell a claim rather than a
# hope. Without them the handshake would still very likely negotiate
# X25519MLKEM768 -- OpenSSL 3.5 offers it first -- and would fall back to a
# classical group without a word if veepin ever stopped requiring one. With them
# there is no classical path through this handshake at all, so a regression fails
# here instead of passing quietly. The same argument ../sshd-pq's KexAlgorithms
# line makes.
#
# No tls-auth or tls-crypt: both are HMAC over a symmetric key, which no quantum
# adversary breaks, so the variant neither needs nor forbids one.
dev tun
proto udp
port 1194
topology subnet
server 10.8.0.0 255.255.255.0
ca /pki/ca.crt
cert /pki/server.crt
key /pki/server.key
dh none
tls-version-min 1.3
tls-groups X25519MLKEM768:MLKEM768
data-ciphers AES-256-GCM
data-ciphers-fallback AES-256-GCM
keepalive 10 60
verb 4
