# veepin pq-masque client <-> veepin pq-masque server.
#
# MASQUE is TLS 1.3 unconditionally, so the version floor pq- imposes changes
# nothing here; what the variant adds is the refusal. The base negotiates
# X25519MLKEM768 by preference and settles for a classical group if that is all
# the peer offers, and pq-masque does not settle.
#
# Self-test, and labelled as one in the matrix. The peer for the classical cells is aioquic, which brings its own hand-written
# TLS 1.3 in Python: measured on 2026-08-25 against aioquic 1.3.0 (the latest
# release), its Group enum holds SECP256R1/384R1/521R1, X25519, X448 and GREASE
# -- no ML-KEM member at all -- and its SignatureAlgorithm enum has no ML-DSA.
# There is no peer here and no near prospect of one, so this cell is
# veepin<->veepin and the directional cells carry the fixed no-peer label.
#
# What it proves that no unit test does is the whole facade path in one piece:
# an ML-DSA-65 credential through the real parseServerOptions, CheckCredential
# accepting it at construction, HardenTLS pinning curves and leaf algorithm on
# both ends, and the data path carrying real packets over the result. Both
# clients pass -insecure, which skips chain building but NOT pqpolicy's
# VerifyPeerCertificate hook -- crypto/tls calls that even with
# InsecureSkipVerify, which is what lets a self cell prove the authentication
# half at all.
name: veepin-interop-pq-masque-self

services:
  veepin-pq-masque-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN, NET_RAW]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      POOL: "10.30.0.0/24"
      PROTOCOL: "pq-masque"
    volumes:
      - ./masque/pki-pq:/pki:ro
      - ./veepin/masque-server-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  veepin-pq-masque-client:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    depends_on: [veepin-pq-masque-server]
    environment:
      SERVER: "veepin-pq-masque-server"
      PROTOCOL: "pq-masque"
    volumes:
      - ./veepin/masque-client-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
