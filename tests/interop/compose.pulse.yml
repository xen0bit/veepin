# Independent openconnect Ivanti client -> veepin gateway, on IF-T/TLS.
#
# openconnect is the only implementation of this protocol outside Ivanti's own,
# and it is strict: it checks the length relationships inside every
# configuration packet, the nesting of every EAP layer, and the exact shape of
# the authentication conversation. If veepin has any of that wrong, the client
# refuses before a packet moves. The gateway publishes its certificate into a
# shared volume; the client pins it by fingerprint.
#
# Data-path check: the openconnect client pings 10.70.0.1, the gateway.
name: veepin-interop-pulse

volumes:
  certs:

services:
  veepin-pulse-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN, NET_RAW]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      USER: "alice"
      PASSWORD: "s3cret"
      POOL: "10.70.0.0/24"
      NO_ESP: "1"
    volumes:
      - ./veepin/pulse-server-entrypoint.sh:/entrypoint.sh:ro
      - certs:/certs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  opnc-pulse-client:
    build:
      context: pulse
    image: interop-pulse
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    depends_on: [veepin-pulse-server]
    environment:
      SERVER: "veepin-pulse-server"
      USER: "alice"
      PASSWORD: "s3cret"
      NO_ESP: "1"
    volumes:
      - ./pulse/openconnect-entrypoint.sh:/entrypoint.sh:ro
      - certs:/certs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
