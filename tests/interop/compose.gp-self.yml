# veepin GlobalProtect client -> veepin GlobalProtect gateway over real TLS, on
# the ESP data path.
#
# The veepin<->veepin sanity check. Its value is attribution: if it passes while
# the openconnect cells fail, veepin and the GlobalProtect protocol have diverged
# rather than veepin being broken.
#
# Data-path check: the veepin client pings 10.50.0.1, the gateway.
name: veepin-interop-gp-self

services:
  veepin-gp-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN, NET_RAW]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      USER: "alice"
      PASSWORD: "s3cret"
      POOL: "10.50.0.0/24"
    volumes:
      - ./veepin/gp-server-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  veepin-gp-client:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    depends_on: [veepin-gp-server]
    environment:
      SERVER: "veepin-gp-server"
      USER: "alice"
      PASSWORD: "s3cret"
    volumes:
      - ./veepin/gp-client-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
