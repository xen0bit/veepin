# Reference wireguard-go client -> veepin WireGuard server, with the server
# permanently under load (`veepin serve wireguard -cookie-threshold -1`).
#
# Every initiation must prove its source address before the server spends a
# Diffie-Hellman on it: one without a valid mac2 gets a cookie reply and nothing
# else. wireguard-go has to open that reply (XChaCha20-Poly1305 under a key
# derived from our public key, bound to its own mac1), keep the cookie, and
# retry with mac2 computed from it. A ping that gets through proves all of it,
# because at -1 no handshake can complete any other way -- and it is the only
# way to test our cookie reply against an implementation that is not ours.
name: veepin-interop-wg-server-cookie

x-wg-keys: &wg-keys
  SERVER_PRIVATE: "+IRmjL6NRpthikeXn+jGUJNLe1ZJKQaqeWubiG9+GHs="
  SERVER_PUBLIC: "srb9CBWUN+UL2CYhqHoL+rGKFPNu6nUJiNStgH0EBWM="
  CLIENT_PRIVATE: "CHk+5XZnPhJ+UXfIx83SaePpgYrK+0/FqiPvNvTp3Hg="
  CLIENT_PUBLIC: "gjMMAROzi5lHFapIKeaAdJ2RhGe0lW24XysGzBd1OSM="
  PSK: "cjldFdAmi69yIFhc0Sms/5Yz6boVXkMZbMJl+RzzMZM="
  SERVER_TUN_IP: "10.10.10.1"
  CLIENT_TUN_IP: "10.10.10.2"

services:
  veepin-wg-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      <<: *wg-keys
      COOKIE_THRESHOLD: "-1"
    volumes:
      - ./veepin/wg-server-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  wg-client:
    build:
      context: wireguard
    image: interop-wireguard
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    depends_on: [veepin-wg-server]
    environment:
      <<: *wg-keys
      SERVER: "veepin-wg-server"
    volumes:
      - ./wireguard/client-entrypoint.sh:/entrypoint.sh:ro
    command: ["/bin/sh", "/entrypoint.sh"]
