# Direction B with downstream flow shaping on: strongSwan client (initiator) ->
# veepin server running `veepin serve ikev2 -shape`.
#
# This is the cell that decides whether shaping can ever default to on. The
# server pads outbound ESP with RFC 4303 2.7 traffic-flow-confidentiality
# padding, whose filler is delimited only by the inner IP header's own length.
# The RFC requires a receiver to cope with that; this proves a real one does.
# A ping reply proves the padded packets were accepted AND correctly trimmed --
# a receiver that failed to strip the filler would not produce a valid reply.
name: veepin-interop-b-shaped

services:
  veepin-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
      net.ipv4.ip_forward: "1"
    environment:
      PSK: "interop-test-psk"
      SERVER_ID: "vpn.example.com"
      POOL: "10.10.10.0/24"
      SHAPE: "16384"
    volumes:
      - ./veepin/server-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  strongswan-client:
    build:
      context: strongswan
    image: interop-strongswan
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    depends_on: [veepin-server]
    volumes:
      - ./strongswan/swanctl-client.conf:/etc/swanctl/swanctl.conf:ro
      - ./strongswan/client-entrypoint.sh:/entrypoint.sh:ro
    command: ["/bin/sh", "/entrypoint.sh"]
