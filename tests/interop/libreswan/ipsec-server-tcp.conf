# libreswan as the IKEv2 responder over RFC 8229/9329 TCP encapsulation
# (`veepin connect ikev2 -tcp` -> here). Identical to ipsec-server.conf but for
# `enable-tcp=yes`; the cell also starts pluto with --no-listen-udp, so there is
# no UDP socket for a fallback to land on and a passing ping can only have
# crossed the TCP stream.
#
# `encapsulation=yes` stays. It is about ESP's shape rather than its carrier:
# veepin has no raw-IP ESP path, so ESP is encapsulated whatever moves it.

config setup
    logfile=/dev/stderr
    logtime=no
    logappend=no
    plutodebug=none
    uniqueids=no
    # A container has no /proc/sys/net/core/xfrm_* tuning worth touching and no
    # DNSSEC root key; without this pluto refuses to start.
    dnssec-enable=no

conn rw
    left=%defaultroute
    leftid=@vpn.example.com
    # Offer a full tunnel; the negotiated remote TS narrows to the client's
    # assigned virtual IP. 10.20.30.254 (added to lo by the entrypoint) is the
    # in-tunnel ping target for the data-path check.
    leftsubnet=0.0.0.0/0
    right=%any
    rightid=@client.example.com
    rightaddresspool=10.20.30.10-10.20.30.100
    authby=secret
    keyexchange=ikev2
    ike=aes_gcm256-sha2_256-dh31
    esp=aes_gcm256
    encapsulation=yes
    narrowing=yes
    enable-tcp=yes
    rekey=no
    auto=add
