# libreswan as the IKEv2 initiator (here -> `veepin serve ikev2`), over plain
# UDP. The mirror of ipsec-server.conf: same PSK, same identities, same one
# negotiable common suite.
#
# `leftmodecfgclient=yes` + `modecfgpull=yes` is the libreswan spelling of
# strongSwan's `vips = 0.0.0.0`: request a virtual IP from the server's
# config-mode pool rather than tunnel a fixed subnet. veepin's responder assigns
# from -pool and narrows TSi to the address it handed out, so without this the
# traffic selectors do not meet.

config setup
    logfile=/dev/stderr
    logtime=no
    logappend=no
    plutodebug=none
    uniqueids=no
    dnssec-enable=no

conn ss
    left=%defaultroute
    leftid=@client.example.com
    leftmodecfgclient=yes
    modecfgpull=yes
    right=veepin-server
    rightid=@vpn.example.com
    # The veepin server's tunnel subnet; its gateway 10.10.10.1 is the in-tunnel
    # ping target.
    rightsubnet=10.10.10.0/24
    authby=secret
    keyexchange=ikev2
    ike=aes_gcm256-sha2_256-dh31
    esp=aes_gcm256
    encapsulation=yes
    narrowing=yes
    rekey=no
    auto=add
