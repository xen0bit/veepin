# libreswan as the IKEv2 responder (veepin ikev2 client -> here), over plain
# UDP. This is the cell that proves the peer image works at all, so it changes
# nothing else: the same PSK, identities and one negotiable common suite the
# strongSwan cells use.
#
# `encapsulation=yes` is the libreswan spelling of strongSwan's `encap = yes`.
# veepin has no raw-IP ESP path -- everything rides UDP 4500 -- so without this
# libreswan would answer with proto-50 ESP and the tunnel would come up and
# carry nothing.

config setup
    logfile=/dev/stderr
    logtime=no
    logappend=no
    plutodebug=none
    uniqueids=no
    # A container has no /proc/sys/net/core/xfrm_* tuning worth touching and no
    # DNSSEC root key; without this pluto refuses to start.
    dnssec-enable=no

conn rw
    left=%defaultroute
    leftid=@vpn.example.com
    # Offer a full tunnel; the negotiated remote TS narrows to the client's
    # assigned virtual IP. 10.20.30.254 (added to lo by the entrypoint) is the
    # in-tunnel ping target for the data-path check.
    leftsubnet=0.0.0.0/0
    right=%any
    rightid=@client.example.com
    rightaddresspool=10.20.30.10-10.20.30.100
    authby=secret
    keyexchange=ikev2
    ike=aes_gcm256-sha2_256-dh31
    esp=aes_gcm256
    encapsulation=yes
    narrowing=yes
    rekey=no
    auto=add
