# libreswan as the IKEv2 initiator over RFC 8229/9329 TCP encapsulation
# (here -> `veepin serve ikev2 -tcp`).
#
# `enable-tcp=yes`, not `fallback`. Fallback is what the deployment story is
# about, but libreswan reaches it only after its own IKE retransmit sequence
# times out -- eight attempts over about a minute -- and what that would be
# testing is libreswan's timer, not veepin's responder. The cell instead blocks
# UDP outright in the client container and dials TCP directly: same end state,
# a minute cheaper on the matrix's slowest shard, and the iptables rule is still
# what stops it being a false green.
#
# `leftmodecfgclient=yes` + `modecfgpull=yes` is the libreswan spelling of
# strongSwan's `vips = 0.0.0.0`: request a virtual IP from the server's
# config-mode pool rather than tunnel a fixed subnet. veepin's responder assigns
# from -pool and narrows TSi to the address it handed out, so without this the
# traffic selectors do not meet.

config setup
    logfile=/dev/stderr
    logtime=no
    logappend=no
    plutodebug=none
    uniqueids=no
    dnssec-enable=no

conn ss
    left=%defaultroute
    leftid=@client.example.com
    leftmodecfgclient=yes
    modecfgpull=yes
    right=veepin-server
    rightid=@vpn.example.com
    # The veepin server's tunnel subnet; its gateway 10.10.10.1 is the in-tunnel
    # ping target.
    rightsubnet=10.10.10.0/24
    authby=secret
    keyexchange=ikev2
    ike=aes_gcm256-sha2_256-dh31
    esp=aes_gcm256
    encapsulation=yes
    narrowing=yes
    enable-tcp=yes
    tcp-remoteport=4500
    rekey=no
    auto=add
