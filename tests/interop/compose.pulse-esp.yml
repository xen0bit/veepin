# openconnect Ivanti client -> veepin gateway, on the ESP data path.
#
# The part of this protocol nothing else here resembles: the gateway mints an
# SPI and a keying block and pushes them in a fixed-layout binary packet whose
# SPI field is little-endian, and the client answers with its own. A ping alone
# would pass on a silent fallback to the IF-T/TLS path, so the run additionally
# requires openconnect to report that ESP came up.
#
# Data-path check: the openconnect client pings 10.70.0.1 over ESP.
name: veepin-interop-pulse-esp

volumes:
  certs:

services:
  veepin-pulse-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN, NET_RAW]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      USER: "alice"
      PASSWORD: "s3cret"
      POOL: "10.70.0.0/24"
    volumes:
      - ./veepin/pulse-server-entrypoint.sh:/entrypoint.sh:ro
      - certs:/certs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  opnc-pulse-client:
    build:
      context: pulse
    image: interop-pulse
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    depends_on: [veepin-pulse-server]
    environment:
      SERVER: "veepin-pulse-server"
      USER: "alice"
      PASSWORD: "s3cret"
    volumes:
      - ./pulse/openconnect-entrypoint.sh:/entrypoint.sh:ro
      - certs:/certs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
