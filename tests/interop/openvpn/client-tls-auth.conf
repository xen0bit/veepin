# Reference OpenVPN client -> veepin server, with --tls-auth: an HMAC-SHA256
# over every control-channel packet under a shared static key. Data channel
# stays AES-256-GCM.
#
# The mirror of the client-side cell. There, a veepin client authenticated its
# control channel to a real OpenVPN server; here a real OpenVPN client
# authenticates to the veepin server, which is the direction that exercises the
# server's *verification* of the HMAC rather than its generation of one.
#
# key-direction 1 on the client pairs with 0 on the server: tls-auth splits the
# static key into per-direction halves, so a server that verified with its own
# half would reject every packet. That asymmetry is the thing this cell would
# catch and the tls-crypt cell cannot, since tls-crypt has no key direction.
client
dev tun
proto udp
remote veepin-ovpn-server 1194
topology subnet
ca /pki/ca.crt
cert /pki/client.crt
key /pki/client.key
tls-auth /pki/ta.key 1
auth SHA256
remote-cert-tls server
data-ciphers AES-256-GCM
data-ciphers-fallback AES-256-GCM
keepalive 10 60
nobind
resolv-retry infinite
connect-retry 2
verb 4
