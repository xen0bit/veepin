# Reference OpenVPN client -> veepin server, with --tls-crypt: every control
# packet is authenticated with HMAC-SHA256 and encrypted with AES-256-CTR under
# a shared static key. Data channel stays AES-256-GCM.
#
# This configuration could not connect to the veepin server before the server
# learned to unwrap the control channel: the wrapping is not negotiated, so the
# two sides must agree, and a plain server cannot parse a wrapped packet at all.
client
dev tun
proto udp
remote veepin-ovpn-server 1194
topology subnet
ca /pki/ca.crt
cert /pki/client.crt
key /pki/client.key
tls-crypt /pki/ta.key
remote-cert-tls server
data-ciphers AES-256-GCM
data-ciphers-fallback AES-256-GCM
keepalive 10 60
nobind
resolv-retry infinite
connect-retry 2
verb 4
