# Reference OpenVPN client -> veepin server, dual-stack inside the tunnel.
#
# Nothing here asks for IPv6. That is the point: `ifconfig-ipv6` is a *pushed*
# option, so a stock client configures its v6 address entirely from what the
# server sends. If veepin's push is malformed -- wrong argument order, wrong
# prefix, an option the client does not recognise -- this client either logs the
# failure and comes up IPv4-only, or refuses. Either way the v6 ping stops.

client
dev tun
proto udp
remote veepin-ovpn-server 1194
topology subnet
ca /pki/ca.crt
cert /pki/client.crt
key /pki/client.key
remote-cert-tls server
data-ciphers AES-256-GCM
data-ciphers-fallback AES-256-GCM
keepalive 10 60
nobind
resolv-retry infinite
connect-retry 2
verb 4
