# openconnect Ivanti client -> veepin gateway, with downstream shaping on.
#
# The gateway pads each inner flow's first 16 KiB towards the tunnel MTU. On the
# IF-T/TLS path that padding is trailing filler after the inner packet, which a
# receiver discards by reading the IP header's own Total Length -- as every IP
# stack does. This proves openconnect's Pulse receive path does too, rather than
# handing the padded buffer to the interface whole.
#
# Data-path check: the openconnect client pings 10.70.0.1 across a shaped tunnel.
name: veepin-interop-pulse-shaped

volumes:
  certs:

services:
  veepin-pulse-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN, NET_RAW]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      USER: "alice"
      PASSWORD: "s3cret"
      POOL: "10.70.0.0/24"
      NO_ESP: "1"
      SHAPE: "16384"
    volumes:
      - ./veepin/pulse-server-entrypoint.sh:/entrypoint.sh:ro
      - certs:/certs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  opnc-pulse-client:
    build:
      context: pulse
    image: interop-pulse
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    depends_on: [veepin-pulse-server]
    environment:
      SERVER: "veepin-pulse-server"
      USER: "alice"
      PASSWORD: "s3cret"
      NO_ESP: "1"
    volumes:
      - ./pulse/openconnect-entrypoint.sh:/entrypoint.sh:ro
      - certs:/certs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
