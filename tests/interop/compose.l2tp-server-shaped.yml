# Reference L2TP/IPsec client (strongSwan + xl2tpd + pppd) -> veepin L2TP
# server, with downstream flow shaping on (`veepin serve l2tp -shape`).
#
# L2TP/IPsec stacks PPP inside L2TP inside ESP, and the padding goes in the
# innermost of those: the PPP Information field, which RFC 1661 §5.1 allows to be
# padded up to the MRU and leaves the carried protocol to delimit — IP does that
# with its Total Length. Padding there rather than with ESP's own TFC padding
# keeps the shaper reading the inner 5-tuple, which is the only place it is
# still visible.
#
# The client pings 10.20.0.1; a reply could not come back from a mis-trimmed
# packet, so this proves pppd trims rather than merely tolerates.
name: veepin-interop-l2tp-server-shaped

services:
  veepin-l2tp-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      PSK: "l2tpsecret"
      USER: "l2tpuser"
      PASS: "l2tppass"
      SHAPE: "16384"
    volumes:
      - ./veepin/l2tp-server-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  l2tp-client:
    build:
      context: l2tp-client
    image: interop-l2tp-client
    # pppd sets the PPP line discipline on its pty, which needs privileges beyond
    # NET_ADMIN inside a container — the same requirement the SSTP interop has.
    privileged: true
    devices:
      - "/dev/ppp:/dev/ppp"
    depends_on: [veepin-l2tp-server]
    environment:
      USER: "l2tpuser"
      PASS: "l2tppass"
    volumes:
      - ./l2tp-client/entrypoint.sh:/entrypoint.sh:ro
      - ./l2tp-client:/conf:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
