# wireguard-go client -> veepin WireGuard server, carrying IPv6 inside.
#
# The underlay stays IPv4; only the inner family changes. That is the half that
# was broken: `wgTunnel.sourceAllowed` -- the inbound direction of cryptokey
# routing -- read the IPv4 header and returned false for anything else, so a
# peer whose AllowedIPs named a v6 prefix had every inbound v6 packet dropped
# as a routing violation. AllowedIPs parses v6, stores it, and installs routes
# from it, so the option was accepted and then ignored, and nothing logged the
# drop.
#
# **This is the server direction on purpose.** verifySource is set only on the
# server (wireguard/server.go:539) and not on the client (wireguard/wireguard.go:287),
# so sourceAllowed only ever runs in this role. A client-direction cell was
# written first and passed with the bug deliberately reintroduced -- it proved
# nothing, because the client never consults the function under test.
name: veepin-interop-wg-v6

x-wg-keys: &wg-keys
  SERVER_PRIVATE: "+IRmjL6NRpthikeXn+jGUJNLe1ZJKQaqeWubiG9+GHs="
  SERVER_PUBLIC: "srb9CBWUN+UL2CYhqHoL+rGKFPNu6nUJiNStgH0EBWM="
  CLIENT_PRIVATE: "CHk+5XZnPhJ+UXfIx83SaePpgYrK+0/FqiPvNvTp3Hg="
  CLIENT_PUBLIC: "gjMMAROzi5lHFapIKeaAdJ2RhGe0lW24XysGzBd1OSM="
  PSK: "cjldFdAmi69yIFhc0Sms/5Yz6boVXkMZbMJl+RzzMZM="
  SERVER_TUN_IP: "10.10.10.1"
  CLIENT_TUN_IP: "10.10.10.2"
  SERVER_TUN_IP6: "fd00:10:10::1"
  CLIENT_TUN_IP6: "fd00:10:10::2"

services:
  veepin-wg-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      <<: *wg-keys
    volumes:
      - ./veepin/wg-server-v6-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  wg-client:
    build:
      context: wireguard
    image: interop-wireguard
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    depends_on: [veepin-wg-server]
    environment:
      <<: *wg-keys
      SERVER: "veepin-wg-server"
    volumes:
      - ./wireguard/client-v6-entrypoint.sh:/entrypoint.sh:ro
    command: ["/bin/sh", "/entrypoint.sh"]
