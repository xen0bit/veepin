# charon-systemd logs to the journal, which a container does not have. Add a
# stdout target so a failing cell explains itself in `docker compose logs`.
# Dropped into strongswan.d/ rather than replacing /etc/strongswan.conf, which
# Debian owns and which carries the plugin load list.
charon {
    filelog {
        stdout {
            default = 2
            ike = 4
            enc = 3
            cfg = 3
            flush_line = yes
        }
    }
}
