# Independent openconnect Fortinet client -> veepin Fortinet gateway, with
# downstream flow shaping on (`veepin serve fortinet -shape`).
#
# The Fortinet data channel is PPP over TLS, so the padding vehicle is the same
# one SSTP uses: RFC 1661 §5.1 lets the Information field carry arbitrary filler
# after the payload, and the carried protocol — IP — distinguishes it by its own
# Total Length. This cell proves openconnect's Fortinet data path does the
# trimming: the client pings 10.40.0.1 and a reply could not come back from a
# mis-trimmed packet.
name: veepin-interop-fortinet-shaped

volumes:
  certs:

services:
  veepin-fortinet-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN, NET_RAW]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      USER: "alice"
      PASSWORD: "s3cret"
      POOL: "10.40.0.0/24"
      SHAPE: "16384"
    volumes:
      - ./veepin/fortinet-server-entrypoint.sh:/entrypoint.sh:ro
      - certs:/certs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  opnc-fortinet-client:
    build:
      context: fortinet
    image: interop-fortinet
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    depends_on: [veepin-fortinet-server]
    environment:
      SERVER: "veepin-fortinet-server"
      USER: "alice"
      PASSWORD: "s3cret"
      NO_DTLS: "1"
    volumes:
      - ./fortinet/openconnect-entrypoint.sh:/entrypoint.sh:ro
      - certs:/certs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
