# Reference wireguard-go client -> veepin WireGuard server, with downstream flow
# shaping on (`veepin serve wireguard -shape`).
#
# The server pads outbound transport messages well past WireGuard's mandatory
# 16-octet alignment. Nothing in the protocol delimits that filler -- the inner
# IP header's own length does -- so this proves a real wireguard-go receiver
# trims by the header rather than trusting the message size. A ping reply proves
# both that the padded packets were accepted and that they were trimmed
# correctly, since a mis-trimmed packet could not produce a valid reply.
name: veepin-interop-wg-server-shaped

x-wg-keys: &wg-keys
  SERVER_PRIVATE: "+IRmjL6NRpthikeXn+jGUJNLe1ZJKQaqeWubiG9+GHs="
  SERVER_PUBLIC: "srb9CBWUN+UL2CYhqHoL+rGKFPNu6nUJiNStgH0EBWM="
  CLIENT_PRIVATE: "CHk+5XZnPhJ+UXfIx83SaePpgYrK+0/FqiPvNvTp3Hg="
  CLIENT_PUBLIC: "gjMMAROzi5lHFapIKeaAdJ2RhGe0lW24XysGzBd1OSM="
  PSK: "cjldFdAmi69yIFhc0Sms/5Yz6boVXkMZbMJl+RzzMZM="
  SERVER_TUN_IP: "10.10.10.1"
  CLIENT_TUN_IP: "10.10.10.2"

services:
  veepin-wg-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      <<: *wg-keys
      SHAPE: "16384"
    volumes:
      - ./veepin/wg-server-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  wg-client:
    build:
      context: wireguard
    image: interop-wireguard
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    depends_on: [veepin-wg-server]
    environment:
      <<: *wg-keys
      SERVER: "veepin-wg-server"
    volumes:
      - ./wireguard/client-entrypoint.sh:/entrypoint.sh:ro
    command: ["/bin/sh", "/entrypoint.sh"]
