# strongSwan as the IKEv2 initiator authenticating with EAP-MSCHAPv2
# (Direction B: here -> veepin serve ikev2 -eap-users).
#
# The asymmetry is the point and is what RFC 7296 §2.16 describes: the initiator
# omits its AUTH payload to ask for EAP, the responder still authenticates
# itself normally — with the PSK here — and once EAP-MSCHAPv2 succeeds both
# sides compute a final AUTH keyed by the EAP MSK rather than by the PSK.
#
# So a break anywhere in the MSCHAPv2 arithmetic (the NT hash, the challenge
# response, the MSK derivation) stops the tunnel, which is exactly what no other
# cell covered: EAP was implemented, documented and shipped without ever being
# run against a real peer.
connections {
    ss {
        version = 2
        remote_addrs = veepin-server
        proposals = aes256gcm16-prfsha256-curve25519
        encap = yes
        vips = 0.0.0.0
        rekey_time = 0
        local {
            auth = eap-mschapv2
            # Both are needed. eap_id is the identity inside EAP, which is what
            # veepin looks up in its -eap-users file; id is the IKE IDi, and is
            # also the key strongSwan matches the eap secret below against. Leave
            # id unset and it defaults to the local IP, so the secret lookup
            # fails with "no EAP key found for hosts ...".
            id = alice
            eap_id = alice
        }
        remote {
            auth = psk
            id = vpn.example.com
        }
        children {
            ss {
                esp_proposals = aes256gcm16
                remote_ts = 10.10.10.0/24
                start_action = trap
                rekey_time = 0
            }
        }
    }
}

secrets {
    # The responder's own authentication is still the PSK.
    ike-ss {
        secret = "interop-test-psk"
    }
    # The EAP credential the veepin server checks against its -eap-users file.
    eap-alice {
        id = alice
        secret = "wonderland"
    }
}
