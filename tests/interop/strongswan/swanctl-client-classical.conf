# strongSwan IKEv2 initiator with a CLASSICAL-only proposal.
#
# It is the pq-ikev2 refusal cell's peer: identical to swanctl-client-pq.conf
# except that the ke1_mlkem768 additional key exchange is gone. Against base
# ikev2 this connects perfectly well; against pq-ikev2 it must be refused with
# NO_PROPOSAL_CHOSEN, which is the entire reason the variant name exists.
connections {
    ss {
        version = 2
        remote_addrs = veepin-server
        proposals = aes256gcm16-prfsha256-curve25519
        encap = yes
        vips = 0.0.0.0
        rekey_time = 0
        local {
            auth = psk
            id = client.example.com
        }
        remote {
            auth = psk
            id = vpn.example.com
        }
        children {
            ss {
                esp_proposals = aes256gcm16
                remote_ts = 10.10.10.0/24
                start_action = trap
                rekey_time = 0
            }
        }
    }
}

secrets {
    ike-ss {
        secret = "interop-test-psk"
    }
}
