# strongSwan as the Cisco IPsec initiator (here -> veepin serve cisco).
#
# The mirror of swanctl-cisco-server.conf: the same Aggressive Mode + XAuth +
# Mode-Config profile with the roles swapped. vips = 0.0.0.0 makes strongSwan
# pull its address from the gateway with Mode-Config, which is what veepin's
# responder answers.
connections {
    ra {
        version = 1
        aggressive = yes
        proposals = aes256-sha256-modp2048
        encap = yes
        rekey_time = 0
        vips = 0.0.0.0
        remote_addrs = veepin-cisco-server
        local {
            auth = psk
            id = keyid:engineering
        }
        local-xauth {
            auth = xauth
            xauth_id = alice
        }
        # veepin's gateway presents its own outer address as ID_IPV4_ADDR, which
        # inside compose is whatever Docker assigned it — so match on anything.
        remote {
            auth = psk
            id = %any
        }
        children {
            ra {
                esp_proposals = aes256-sha256
                # Route the veepin tunnel subnet through the SA; the gateway's
                # 10.60.0.1 is the in-tunnel ping target.
                remote_ts = 10.60.0.0/24
                start_action = trap
                rekey_time = 0
            }
        }
    }
}

secrets {
    ike-ra {
        secret = "the-group-secret"
    }
    xauth-alice {
        id = alice
        secret = "hunter2"
    }
}
