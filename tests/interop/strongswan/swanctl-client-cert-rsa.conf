# strongSwan as the IKEv2 initiator with RSA-2048 certificate authentication
# (Direction B: here -> veepin serve ikev2). Both ends present a leaf plus an
# intermediate chaining to a shared root, so both IKE_AUTH messages are
# 2.5-3.5 KB and must be RFC 7383 fragmented -- the entrypoint drops IP
# fragments, so there is no other way across.
#
# `fragmentation = yes` (the default) advertises support without forcing it,
# which is the honest setting here: the claim under test is that veepin decides
# to fragment on its own because the message is large, not that it obeys an
# instruction to always fragment. compose.server-ss-frag.yml already covers the
# forced case from the other side.
connections {
    ss {
        version = 2
        remote_addrs = veepin-server
        proposals = aes256gcm16-prfsha256-curve25519
        encap = yes
        vips = 0.0.0.0
        rekey_time = 0
        fragmentation = yes
        local {
            auth = pubkey
            id = client.example.com
            certs = client-cert.pem
        }
        remote {
            auth = pubkey
            id = vpn.example.com
        }
        children {
            ss {
                esp_proposals = aes256gcm16
                remote_ts = 10.10.10.0/24
                start_action = trap
                rekey_time = 0
            }
        }
    }
}
