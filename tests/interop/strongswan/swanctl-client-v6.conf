# strongSwan as the IKEv2 initiator, dual-stack (Direction B: here -> veepin
# serve ikev2). Same suite as swanctl-client.conf; the difference is that it
# requests a virtual address in both families (vips = 0.0.0.0, ::) and narrows
# its remote traffic selectors to both of the veepin server's tunnel subnets.
#
# The in-tunnel ping targets are 10.10.10.1 and fd00:10:10::1 -- the veepin
# server's own gateway addresses in each family. The v6 one is the assertion
# that matters: it is the address `veepin serve -setup-nat` must put on the TUN,
# and before internal/hostnet learned to do that, nothing answered it.
connections {
    ss {
        version = 2
        remote_addrs = veepin-server
        proposals = aes256gcm16-prfsha256-curve25519
        encap = yes
        vips = 0.0.0.0, ::
        rekey_time = 0
        local {
            auth = psk
            id = client.example.com
        }
        remote {
            auth = psk
            id = vpn.example.com
        }
        children {
            ss {
                esp_proposals = aes256gcm16
                remote_ts = 10.10.10.0/24,fd00:10:10::/64
                start_action = trap
                rekey_time = 0
            }
        }
    }
}

secrets {
    ike-ss {
        secret = "interop-test-psk"
    }
}
