# strongSwan IKEv2 initiator asking for IP-TFS (RFC 9347), so veepin's server
# has to answer a real peer's USE_AGGFRAG rather than its own client's.
#
# The initiator direction is the one that catches a responder which echoes the
# notify without meaning it: strongSwan installs an XFRM SA in mode 5 (IPTFS) on
# the strength of that echo, and if veepin then sends plain inner IP the kernel
# drops every packet.
connections {
    ss {
        version = 2
        remote_addrs = veepin-server
        proposals = aes256gcm16-prfsha256-curve25519
        encap = yes
        vips = 0.0.0.0
        rekey_time = 0
        local {
            auth = psk
            id = client.example.com
        }
        remote {
            auth = psk
            id = vpn.example.com
        }
        children {
            ss {
                mode = iptfs
                esp_proposals = aes256gcm16
                remote_ts = 10.10.10.0/24
                start_action = trap
                rekey_time = 0
            }
        }
    }
}

secrets {
    ike-ss {
        secret = "interop-test-psk"
    }
}
