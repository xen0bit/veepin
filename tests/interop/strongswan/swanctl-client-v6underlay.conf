# strongSwan as the IKEv2 initiator over an IPv6 underlay (Direction B: here ->
# veepin serve ikev2, outer transport over IPv6). Identical to swanctl-client.conf
# except remote_addrs is the veepin server's IPv6 literal, so the IKE/ESP flows
# run over IPv6. encap = yes forces UDP-encapsulated ESP (veepin has no raw-ESP
# path). The inner traffic stays IPv4 (ping 10.10.10.1).
connections {
    ss {
        version = 2
        remote_addrs = fd00:12::10
        proposals = aes256gcm16-prfsha256-curve25519
        encap = yes
        vips = 0.0.0.0
        rekey_time = 0
        local {
            auth = psk
            id = client.example.com
        }
        remote {
            auth = psk
            id = vpn.example.com
        }
        children {
            ss {
                esp_proposals = aes256gcm16
                remote_ts = 10.10.10.0/24
                start_action = trap
                rekey_time = 0
            }
        }
    }
}

secrets {
    ike-ss {
        secret = "interop-test-psk"
    }
}
