# strongSwan as the Cisco IPsec responder (veepin connect cisco -> here).
#
# IKEv1 Aggressive Mode with a group pre-shared key, XAuth for the per-user
# credentials, and a Mode-Config pool for the address assignment: the exact
# profile internal/cisco implements. encap = yes forces UDP-encapsulated ESP,
# because veepin has no raw-ESP path — without a NAT in the middle strongSwan
# would otherwise try IP protocol 50.
connections {
    ra {
        version = 1
        aggressive = yes
        proposals = aes256-sha256-modp2048
        encap = yes
        rekey_time = 0
        pools = ra_pool
        local {
            auth = psk
            id = vpn.example.com
        }
        # The group identity veepin presents as ID_KEY_ID, matched here as a
        # keyid so the group pre-shared key is selected by it.
        remote {
            auth = psk
            id = keyid:engineering
        }
        # XAuth runs after phase 1, driven by this (the responder) end.
        remote-xauth {
            auth = xauth
        }
        children {
            ra {
                esp_proposals = aes256-sha256
                # Offer everything; the negotiated remote TS narrows to the
                # client's assigned address. 10.20.30.254 (added to lo by the
                # entrypoint) is the in-tunnel ping target.
                local_ts = 0.0.0.0/0
                rekey_time = 0
            }
        }
    }
}

pools {
    ra_pool {
        addrs = 10.20.30.0/24
    }
}

secrets {
    ike-ra {
        id = keyid:engineering
        secret = "the-group-secret"
    }
    xauth-alice {
        id = alice
        secret = "hunter2"
    }
}
