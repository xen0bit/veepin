# strongSwan IKEv2 responder with IP-TFS (RFC 9347) on the Child SA.
#
# `mode = iptfs` is the whole of the configuration, and its most important
# property is one swanctl.opt states plainly: "The transport, iptfs and beet
# modes are subject to mode negotiation; tunnel mode is negotiated if the
# preferred mode is not available."
#
# So a client that fails to negotiate USE_AGGFRAG gets an ordinary tunnel-mode
# Child SA and a ping that crosses it perfectly. That is why the cell using this
# file asserts a log line naming AGGFRAG rather than trusting the ping -- a bare
# ping here is the textbook false green.
connections {
    rw {
        version = 2
        proposals = aes256gcm16-prfsha256-curve25519
        rekey_time = 0
        pools = rw_pool
        local {
            auth = psk
            id = vpn.example.com
        }
        remote {
            auth = psk
            id = client.example.com
        }
        children {
            rw {
                mode = iptfs
                esp_proposals = aes256gcm16
                local_ts = 0.0.0.0/0
                rekey_time = 0
            }
        }
    }
}

pools {
    rw_pool {
        addrs = 10.20.30.0/24
    }
}

secrets {
    ike-rw {
        secret = "interop-test-psk"
    }
}
