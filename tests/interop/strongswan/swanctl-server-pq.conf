# strongSwan IKEv2 responder with post-quantum hybrid key exchange.
# Adds ML-KEM-768 as an additional key exchange alongside Curve25519.
connections {
    rw {
        version = 2
        proposals = aes256gcm16-prfsha256-ke1_mlkem768-curve25519
        rekey_time = 0
        pools = rw_pool
        local {
            auth = psk
            id = vpn.example.com
        }
        remote {
            auth = psk
            id = client.example.com
        }
        children {
            rw {
                esp_proposals = aes256gcm16
                local_ts = 0.0.0.0/0
                rekey_time = 0
            }
        }
    }
}

pools {
    rw_pool {
        addrs = 10.20.30.0/24
    }
}

secrets {
    ike-rw {
        secret = "interop-test-psk"
    }
}
