# Independent openconnect GlobalProtect client -> veepin GlobalProtect gateway,
# with downstream flow shaping on.
#
# The gateway pads the first 16 KiB of each inner flow out to the tunnel MTU. The
# client agreed to nothing and knows nothing about it: on the SSL tunnel the
# filler is trailing bytes after the inner packet, which every IP stack trims by
# the packet's own header length. openconnect's ping replies could not come back
# from a mis-trimmed packet, so this cell is what proves shaping is transparent to
# a stock client.
#
# Data-path check: the openconnect client pings 10.50.0.1, the gateway.
name: veepin-interop-gp-shaped

volumes:
  certs:

services:
  veepin-gp-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN, NET_RAW]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      USER: "alice"
      PASSWORD: "s3cret"
      POOL: "10.50.0.0/24"
      SHAPE: "16384"
    volumes:
      - ./veepin/gp-server-entrypoint.sh:/entrypoint.sh:ro
      - certs:/certs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  opnc-gp-client:
    build:
      context: gp
    image: interop-gp
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    depends_on: [veepin-gp-server]
    environment:
      SERVER: "veepin-gp-server"
      USER: "alice"
      PASSWORD: "s3cret"
      NO_ESP: "1"
    volumes:
      - ./gp/openconnect-entrypoint.sh:/entrypoint.sh:ro
      - certs:/certs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
