# veepin Cisco IPsec client -> veepin Cisco IPsec gateway.
#
# The veepin<->veepin sanity check. Its value is attribution: if it passes while
# the strongSwan cells fail, veepin and the protocol have diverged rather than
# veepin being broken.
#
# Data-path check: the veepin client pings 10.60.0.1, the gateway.
name: veepin-interop-cisco-self

services:
  veepin-cisco-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN, NET_RAW]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      GROUP: "engineering"
      GROUP_PSK: "the-group-secret"
      USER: "alice"
      PASSWORD: "hunter2"
      POOL: "10.60.0.0/24"
    volumes:
      - ./veepin/cisco-server-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  veepin-cisco-client:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    depends_on: [veepin-cisco-server]
    environment:
      SERVER: "veepin-cisco-server"
      GROUP: "engineering"
      GROUP_PSK: "the-group-secret"
      USER: "alice"
      PASSWORD: "hunter2"
    volumes:
      - ./veepin/cisco-client-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
