# veepin pq-gp client <-> veepin pq-gp server.
#
# The ESP data path stays, unlike the two DTLS protocols. GlobalProtect derives
# its ESP keys inside the TLS control channel and sends them there, so a
# post-quantum control channel is what protects them: an adversary recording
# today has no way to recover the keys later. ESP itself is AES-GCM, symmetric,
# and not a quantum-broken primitive.
#
# Self-test, and labelled as one in the matrix. No third-party peer exists for this one and none is in prospect; see the
# evidence table in doc/security.md. A veepin<->veepin cell proves the two
# halves agree with each other, not that they are right.
#
# What it proves that no unit test does is the whole facade path in one piece:
# an ML-DSA-65 credential through the real parseServerOptions, CheckCredential
# accepting it at construction, HardenTLS pinning curves and leaf algorithm on
# both ends, and the data path carrying real packets over the result. Both
# clients pass -insecure, which skips chain building but NOT pqpolicy's
# VerifyPeerCertificate hook -- crypto/tls calls that even with
# InsecureSkipVerify, which is what lets a self cell prove the authentication
# half at all.
name: veepin-interop-pq-gp-self

services:
  veepin-pq-gp-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN, NET_RAW]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      USER: "alice"
      PASSWORD: "s3cret"
      POOL: "10.50.0.0/24"
      PROTOCOL: "pq-gp"
    volumes:
      - ./gp/pki-pq:/pki:ro
      - ./veepin/gp-server-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  veepin-pq-gp-client:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    depends_on: [veepin-pq-gp-server]
    environment:
      SERVER: "veepin-pq-gp-server"
      USER: "alice"
      PASSWORD: "s3cret"
      PROTOCOL: "pq-gp"
    volumes:
      - ./veepin/gp-client-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
