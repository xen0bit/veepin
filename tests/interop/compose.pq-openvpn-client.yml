# veepin's pq-openvpn CLIENT -> a real OpenVPN server that requires both halves
# of the post-quantum contract.
#
# The first cell in this tree where a third-party peer verifies veepin's ML-DSA
# AUTHENTICATION rather than only its key exchange. openvpn 2.6.14 links OpenSSL
# 3.5.7, which has ML-DSA and ML-KEM both, and OpenVPN authenticates BOTH ends by
# certificate -- so the client's ML-DSA-65 leaf is checked by OpenVPN's own
# verification path (chain, EKU via remote-cert-tls, key type) and the server's
# by veepin's pqpolicy hook. Two post-quantum signatures on one connection, each
# validated by the other implementation.
#
# The peer config pins tls-version-min 1.3 and a tls-groups list with no
# classical member, so there is no path through this handshake that succeeds
# without ML-KEM. A cell that merely preferred it would pass identically if
# veepin stopped requiring it, which is the failure mode AGENTS.md describes.
#
# Data-path check: the veepin client pings 10.8.0.1, the peer's tunnel gateway.
name: veepin-interop-pq-openvpn-client

services:
  openvpn-pq-server:
    build:
      context: openvpn-pq
    image: interop-openvpn-pq
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      ROLE: "server"
    volumes:
      - ./openvpn/pki-pq:/pki:ro

  veepin-pq-ovpn-client:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: veepin:interop
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    depends_on: [openvpn-pq-server]
    environment:
      SERVER: "openvpn-pq-server"
      PROTOCOL: "pq-openvpn"
    volumes:
      - ./openvpn/pki-pq:/pki:ro
      - ./veepin/openvpn-client-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
